name: ERP KOL SKU Permission P0 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Modules/Identity/Application/RolePreset.php'
      - 'app/Modules/Products/Experience/**'
      - 'resources/js/Components/Products/SkuCombobox*'
      - 'resources/js/Pages/Products/Index*'
      - 'resources/js/Components/DataGrid/ColumnSettingsHeader.vue'
      - 'tests/Feature/Products/**'
      - 'tests/Feature/Identity/**'
      - 'tests/Feature/Orders/KolOrderOwnerScopeTest.php'
      - '.github/workflows/erp-kol-sku-permission-p0.yml'

permissions:
  contents: read

jobs:
  kol-sku-permission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
      - name: Build frontend for Inertia test views
        run: |
          ln -s Pages resources/js/pages
          npm run build
      - name: Prepare isolated SQLite test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --force
      - name: Products, Identity and KOL order scope regressions
        run: php artisan test tests/Feature/Products/ProductManagementTest.php tests/Feature/Products/ProductGridExportTest.php tests/Feature/Identity/PermissionMatrixTest.php tests/Feature/Orders/KolOrderOwnerScopeTest.php
      - name: SKU combobox and Product Grid Vitest
        run: npm test -- resources/js/Components/Products/SkuCombobox.test.ts resources/js/Pages/Products/Index.test.ts
      - name: Frontend typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Patch whitespace check
        run: git diff --check origin/main...HEAD
