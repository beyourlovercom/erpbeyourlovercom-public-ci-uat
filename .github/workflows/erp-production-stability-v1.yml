name: ERP Production Stability V1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'database/migrations/**'
      - 'tests/Architecture/MySqlProductionCompatibilityTest.php'
      - 'tests/Feature/ProductionStability/**'
      - 'tests/Feature/Finance/AccountingContinuousDeltaTest.php'
      - '.github/workflows/erp-production-stability-v1.yml'

permissions:
  contents: read

jobs:
  sqlite-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Static MySQL dialect gate
        run: php artisan test tests/Architecture/MySqlProductionCompatibilityTest.php
      - name: Logistics HTTP query-budget regression gate
        run: php artisan test tests/Feature/ProductionStability/LogisticsWaitStockQueryBudgetTest.php
      - name: Shell permission query-budget regression gate
        run: php artisan test tests/Feature/AppShellNavigationTest.php --filter=shell_navigation_permission_resolution_has_bounded_query_count

  mysql8-runtime:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_stability_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: MySQL 8 migration, critical-query, and Continuous Delta gate
        env:
          BYL_MYSQL_STABILITY_ENABLED: '1'
          BYL_MYSQL_STABILITY_DATABASE: erp_stability_test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: erp_stability_test
          DB_USERNAME: root
          DB_PASSWORD: root
          ERP_LOCAL_ADMIN_BYPASS: 'false'
        run: php artisan test tests/Feature/ProductionStability/MySql8ProductionCompatibilityTest.php tests/Feature/Finance/AccountingContinuousDeltaTest.php
